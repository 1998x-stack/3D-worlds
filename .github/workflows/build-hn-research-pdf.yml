name: Build Codex CAD research PDF

on:
  push:
    branches: [main]
    paths:
      - 'docs/codex-cad-3d-printing-hn-research-2026.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-cad-research-pdf
  cancel-in-progress: false

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF renderer
        run: python -m pip install 'weasyprint==68.0'

      - name: Generate PDF from reviewed HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          from weasyprint import HTML

          source = Path('docs/codex-cad-3d-printing-hn-research-2026.html')
          output = Path('docs/Codex_CAD_3DPrinting_HackerNews_DeepResearch_2026.pdf')
          HTML(filename=str(source), base_url=str(source.parent)).write_pdf(str(output))
          assert output.read_bytes().startswith(b'%PDF-')
          print(f'Generated {output} ({output.stat().st_size:,} bytes)')
          PY

      - name: Commit generated research PDF
        run: |
          git add docs/Codex_CAD_3DPrinting_HackerNews_DeepResearch_2026.pdf
          if git diff --staged --quiet; then
            echo "PDF already up to date"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "docs: publish generated Codex CAD Hacker News research PDF"
            git push
          fi
