name: Verify and Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate three portable Skill packages and references
        run: |
          python scripts/verify_skill_mirrors.py
          python .codex/skills/threejs-model-builder/scripts/preflight.py --json
      - name: Install opt-in print geometry test dependencies
        run: python -m pip install -r requirements-print.txt
      - name: Validate P0/P1/P2 print policy and unreviewed catalog readiness
        run: |
          npm run test:print
          python scripts/audit_print_catalog.py --metadata-only --output .cache/print/catalog-metadata.json
      - name: Validate and build SQLite catalog
        run: |
          python scripts/catalog.py validate
          python scripts/catalog.py build
          python -m unittest discover -s tests -v
      - name: Install OpenSCAD CAD compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openscad slic3r
      - name: Verify representative product CAD STL exports
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for slug in moon-phase-light-sleeve cloud-whale-totem harbor-cargo-diorama modular-pencil-caddy collectible-display-plinth universal-controller-cradle arc-earring-display ribbed-succulent-pot custom-desk-nameplate celestial-guild-medallion; do
            python3 scripts/export_print_commerce.py --only "$slug" --format stl --out .cache/print-cad-test
          done
      - name: Audit ten refined overseas CAD designs
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 scripts/audit_refined_commerce.py --output .cache/print/refined-batch-01-audit.json
      - name: Audit twenty additional refined overseas CAD designs
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 scripts/audit_refined_commerce_batch02.py --output .cache/print/refined-batch-02-audit.json
      - name: Verify parameterized CAD 3MF export
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 scripts/export_print_commerce.py --only monogram-desk-coaster --format 3mf --out .cache/print-cad-test
      - name: Validate two original V1.4.2 CAD pilot solids (not print-certified)
        run: python3 scripts/audit_v14_cad_pilots.py --output .cache/print/v14-cad-pilots.json
      - name: Verify V1.4.3 STL cross-section geometry and offline toolpaths
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 scripts/audit_v14_cad_fit.py --with-slicer --output .cache/print/v14-cad-fit-sections.json
      - name: Archive generated SQLite catalog
        uses: actions/upload-artifact@v4
        with:
          name: 3d-worlds-catalog-sqlite
          path: data/catalog.sqlite
          retention-days: 30
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Check model geometry and coordinates
        run: node scripts/validate_models.mjs
      - name: Validate refined Three.js detail geometry and canonical dimensions
        run: npm run test:refined-commerce
      - name: Test GLB validator and batch ingest
        run: node scripts/test_ingest.mjs
      - name: Install headless Chromium for asset rendering
        run: npx playwright install --with-deps chromium
      - name: P0 generate WebP/AVIF thumbnails and P1 Meshopt LOD0/1/2
        run: npm run generate:assets
      - name: Verify P0 previews, LOD hashes and decodable GLBs
        run: node scripts/verify_generated.mjs
      - name: Audit all 30 V1.4 original source GLBs for manufacturing risks
        run: python3 scripts/audit_v14_manufacturing.py --profile fdm-220 --longest-mm 120 --require-all-sources --output .cache/print/v14-manufacturing-risk.json
      - name: Audit small sample of original GLBs (never publish print-ready claims)
        run: python scripts/audit_print_catalog.py --limit 8 --longest-mm 120 --output .cache/print/catalog-geometry-sample.json
      - name: Archive unreviewed and sampled print QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: 3d-worlds-print-audit-evidence
          path: |
            .cache/print/catalog-*.json
            .cache/print/refined-batch-01-audit.json
            .cache/print/refined-batch-02-audit.json
            .cache/print/v14-manufacturing-risk.json
            .cache/print/v14-cad-pilots.json
            .cache/print/v14-cad-fit-sections.json
          retention-days: 7
      - name: Archive explicitly untested V1.4 CAD pilot STL candidates
        uses: actions/upload-artifact@v4
        with:
          name: v14-cad-prototypes-not-manufacturing-certified
          path: |
            .cache/print/cad-pilot-stl/*.stl
            .cache/print/cad-fit-stl/*.stl
          retention-days: 7
      - name: Archive offline G-code for HUMAN REVIEW only (DO NOT send to printer)
        uses: actions/upload-artifact@v4
        with:
          name: v14-review-only-offline-gcode-NOT-PRINTER-QUALIFIED
          path: .cache/print/cad-fit-toolpaths/*.gcode
          retention-days: 7
      - name: P2 mirror all actual LOD binaries into immutable local object storage
        run: python scripts/smoke_p2.py
      - name: Archive P0/P1 generation quality report
        uses: actions/upload-artifact@v4
        with:
          name: 3d-worlds-previews-and-lods
          path: |
            public/thumbs/
            public/generated/
          retention-days: 7
      - name: Build Vite static site
        run: npm run build
      - name: Browser end-to-end smoke test
        run: node scripts/smoke_gallery.mjs
      - name: P2 browser integration against SQLite search API
        run: node scripts/smoke_remote_gallery.mjs
      - name: Validate MCP Python SDK v2 integration
        run: |
          python -m pip install -r requirements-mcp.txt
          python -m py_compile services/mcp_server.py
          python scripts/smoke_mcp.py
      - uses: actions/upload-artifact@v4
        with:
          name: threejs-pages-dist
          path: dist/
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: threejs-pages-dist
          path: dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v4
